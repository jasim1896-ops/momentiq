/* Layout: one-column phone app, max 520px, fixed bottom tab bar; dark-first, electric blue accent */
:root{
  --bg:#000000; --surface:#111214; --surface2:#1C1C1E; --line:#232428;
  --fg:#F5F5F7; --muted:#A1A1A6; --faint:#8E8E93;
  --accent:#2F8CFF; --on-accent:#00122B; --tint:rgba(47,140,255,.15);
  --danger:#FF6B6B; --tabbar:#0A0A0B; --stripe:.10;
  --font-en: Inter, -apple-system, system-ui, "Segoe UI", sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#ECEEF3; --line:#E1E3EA;
  --fg:#0B0C0F; --muted:#565A66; --faint:#656A76;
  --accent:#0A66E8; --on-accent:#FFFFFF; --tint:rgba(10,102,232,.10);
  --danger:#C62828; --tabbar:#FBFBFD; --stripe:.05; color-scheme: light } }
:root[data-theme="light"]{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#ECEEF3; --line:#E1E3EA;
  --fg:#0B0C0F; --muted:#565A66; --faint:#656A76;
  --accent:#0A66E8; --on-accent:#FFFFFF; --tint:rgba(10,102,232,.10);
  --danger:#C62828; --tabbar:#FBFBFD; --stripe:.05; color-scheme: light }
html,body{background:var(--bg);color:var(--fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body{font-family:var(--font-en);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-family:var(--font-ar)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-en);font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}

h1{margin:0;font-size:36px;font-weight:900;font-style:italic;letter-spacing:-1.2px;line-height:1.05;text-transform:uppercase}
html[lang="ar"] h1{letter-spacing:0;font-weight:700;font-style:normal;text-transform:none}
h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;text-wrap:balance}
html[lang="ar"] h2{letter-spacing:0;font-weight:700}
h3{margin:0;font-size:17px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.accent{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;background:var(--surface2);padding:6px 11px;border-radius:10px;color:var(--fg)}
.pill{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge{font-size:10px;font-weight:800;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:1px 5px;letter-spacing:.3px}
.btn{min-height:52px;border:none;border-radius:12px;font-style:italic;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.sec{background:var(--surface2);color:var(--fg)}

html[lang="ar"] .btn{font-style:normal}
.btn.sm{font-style:normal}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.grey>i{background:var(--faint)}
.note{background:var(--tint);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45}
.note svg{flex-shrink:0;margin-top:1px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:none}
.li .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;font-size:16px;width:100%}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.choice{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.opt .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.switch{width:51px;height:31px;border-radius:16px;border:none;background:var(--surface2);position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:22px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--tabbar);border-top:1px solid var(--line);padding:8px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));z-index:20}
.tabbar nav{max-width:520px;margin:0 auto;display:flex;justify-content:space-around}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:11px;font-weight:600;min-width:60px;min-height:48px;padding:2px 4px}
.tab[aria-current="page"]{color:var(--accent)}
.sets{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:30px 40px minmax(0,1fr) minmax(0,1fr) 46px;gap:10px;align-items:center;min-height:54px;border-top:1px solid var(--line)}
.setrow.headr{min-height:30px;border-top:none;font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
html[lang="ar"] .setrow.headr{text-transform:none;letter-spacing:0}
.setin{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-weight:700;font-size:17px;width:100%;font-family:var(--font-en)}
.setrow.cur .setin{border-color:var(--accent)}
.setrow.done{color:var(--faint)}
.setrow.done .setin{border-color:transparent;background:transparent;color:var(--faint)}
.check{width:44px;height:44px;border-radius:22px;border:1.6px solid var(--faint);background:transparent;display:flex;align-items:center;justify-content:center;justify-self:center}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[data-pop]{animation:popc .35s ease-out}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.progress i.on{background:var(--accent)}
.demo{width:88px;height:88px;border-radius:18px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0}
.sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.foodbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start;padding:12px 4px;border:none;border-top:1px solid var(--line);background:none}
.foodbtn:first-child{border-top:none}
.celebrate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));text-align:center;overflow:hidden}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.9;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}
.ring-done{width:110px;height:110px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

.welcome{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.wband{position:relative;height:280px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));overflow:hidden}
.wband .b1,.wband .b2{position:absolute;left:-40px;right:-40px;top:40px;height:200px;transform:skewY(-14deg)}
.wband .b1{background:linear-gradient(90deg,#0A4FC2,#2F8CFF 60%,#7FBBFF)}
.wband .b2{background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 3px,transparent 3px 18px)}
.wband .kb{position:absolute;left:50%;top:58px;transform:translateX(-50%) rotate(-14deg)}
.wband .go{position:absolute;inset-inline-end:28px;top:92px;transform:rotate(-14deg);font-style:italic;font-weight:900;font-size:60px;color:rgba(0,18,43,.85);letter-spacing:-2px;font-family:var(--font-en)}
html[lang="ar"] .wband .go{font-family:var(--font-ar);font-style:normal;letter-spacing:0}
.wordmark{font-family:var(--font-en);font-style:italic;font-weight:900;font-size:22px;letter-spacing:-.5px;color:var(--accent)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;background:linear-gradient(120deg,#0B55D6,#1E74F0 70%);color:#FFFFFF;display:flex;flex-direction:column;gap:10px}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(110deg,rgba(255,255,255,.09) 0 4px,transparent 4px 22px);pointer-events:none}
.hero>*{position:relative}
.hero .deco{position:absolute;inset-inline-end:-18px;top:14px;transform:rotate(-18deg);pointer-events:none;opacity:.95}
.hero .htitle{font-size:36px;font-weight:900;font-style:italic;letter-spacing:-1px;line-height:1;text-transform:uppercase;max-width:62%}

.hero .hsub{font-size:14px;font-weight:600;color:#DCE9FF}
.hero .heye{font-size:12px;font-weight:800;letter-spacing:.8px;color:#DCE9FF}
.hero .btn{background:#00122B;color:#FFFFFF}
.hero .chip{background:rgba(0,18,43,.28);color:#FFFFFF}
.tile.sp::before{content:"";position:absolute;left:-60px;right:-60px;top:-80px;height:220px;transform:skewY(-14deg);background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 26px);opacity:var(--stripe);pointer-events:none}
.tile{position:relative;overflow:hidden} .tile>*{position:relative}
.bigi{font-size:28px;font-weight:900;font-style:italic;letter-spacing:-.5px}
html[lang="ar"] .bigi{font-style:normal}
.restcard{background:linear-gradient(120deg,#0B55D6,#1E74F0);color:#FFFFFF;border:none;position:relative;overflow:hidden}
.restcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(110deg,rgba(255,255,255,.08) 0 4px,transparent 4px 22px);pointer-events:none}
.restcard>*{position:relative}
.restcard .iconbtn,.restcard .btn.sec{background:rgba(0,18,43,.35);color:#FFFFFF}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,140,255,0)}50%{box-shadow:0 0 0 6px rgba(47,140,255,.22),0 8px 28px rgba(47,140,255,.45)}}

.app.anim .ringfill{animation:ringIn 1s ease-out}
@keyframes popc{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.popnow{animation:popc .35s ease-out}

.app.anim>*{animation:slideIn .35s ease-out both}

.logo{display:flex;align-items:center;gap:12px}
.logo b{font-size:30px;font-weight:800;letter-spacing:-.8px;font-family:var(--font-en)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chart{width:100%;height:auto;display:block}
.lock{opacity:.55}
</style>

function t(k,v){var s=(T[st.lang]&&T[st.lang][k])||T.en[k]||k; if(v){for(var x in v){s=s.split('{'+x+'}').join(v[x]);}} return s;}

/* ---------- Nutrition math ---------- */
var ACT={1:1.2,2:1.375,3:1.55,4:1.725};
function targets(pr){pr=pr||st.profile;if(!pr)return null;
 var bmr=10*pr.weight+6.25*pr.height-5*pr.age+(pr.sex==='male'?5:-161);
 var maint=Math.round(bmr*ACT[pr.activity]/10)*10;
 var goal=pr.age<18?'maintain':pr.goal;
 var k=goal==='lose'?maint*0.8:goal==='gain'?maint*1.1:maint;
 k=Math.round((k+(pr.age<18?0:(st.kcalAdjust||0)))/10)*10;
 var pPer=goal==='lose'?2.0:goal==='gain'?1.8:1.6;
 var hm=pr.height/100,ref=pr.weight/(hm*hm)>27?25*hm*hm:pr.weight;var p=Math.round(ref*pPer), f=Math.round(k*0.25/9), c=Math.max(0,Math.round((k-p*4-f*9)/4));
 return {maint:maint,k:k,p:p,c:c,f:f,goal:goal};}
function dayFood(day){return st.food[day||dkey()]||[];}
function totals(day){var s={k:0,p:0,c:0,f:0};dayFood(day).forEach(function(e){s.k+=e.k;s.p+=e.p;s.c+=e.c;s.f+=e.f;});return s;}
function findFood(id){for(var i=0;i<FOODS.length;i++)if(FOODS[i].id===id)return FOODS[i];for(var j=0;j<st.customFoods.length;j++)if(st.customFoods[j].id===id)return st.customFoods[j];return null;}

function weekStart(ds){var d=new Date(ds+'T12:00:00');var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dkey(d);}
function weeklyAvgs(){var g={};st.weights.forEach(function(w){var k=weekStart(w.date);(g[k]=g[k]||[]).push(w.kg);});
 return Object.keys(g).sort().map(function(k){var a=g[k];return {wk:k,avg:a.reduce(function(x,y){return x+y;},0)/a.length};});}

 var pad=Math.max(0.3,(mx-mn)*0.15);mn-=pad;mx+=pad;
 function X(i){return pl+(W-pl-pr)*i/(wa.length-1);} function Y(v){return pt+(H-pt-pb)*(mx-v)/(mx-mn);}
 var pts=wa.map(function(x,i){return X(i).toFixed(1)+','+Y(x.avg).toFixed(1);}).join(' ');
 var lastI=wa.length-1;
 var area='M'+X(0).toFixed(1)+','+(H-pb)+' L'+pts.split(' ').join(' L')+' L'+X(lastI).toFixed(1)+','+(H-pb)+' Z';
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+t('weekly')+'">'+
  '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>'+
  '<path d="'+area+'" fill="var(--tint)"/><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
  '<circle cx="'+X(lastI)+'" cy="'+Y(wa[lastI].avg)+'" r="5" fill="var(--accent)"/>'+
  '<text x="'+X(lastI)+'" y="'+(Y(wa[lastI].avg)-10)+'" text-anchor="end" fill="var(--fg)" font-size="12" font-weight="700" font-family="Inter,sans-serif">'+fmt(wa[lastI].avg,1)+'</text>'+
  '<text x="'+X(0)+'" y="'+(H-6)+'" fill="var(--faint)" font-size="11" font-family="Inter,sans-serif">'+esc(shortDate(wa[0].wk))+'</text>'+
  '<text x="'+X(lastI)+'" y="'+(H-6)+'" text-anchor="end" fill="var(--faint)" font-size="11" font-family="Inter,sans-serif">'+esc(shortDate(wa[lastI].wk))+'</text></svg>';}
function adaptSuggest(){if(!paid()||isMinor()||!st.profile)return null;var g=st.profile.goal;if(g==='maintain')return null;
 var wa=weeklyAvgs();if(wa.length<3)return null;var ch=(wa[wa.length-1].avg-wa[wa.length-3].avg)/2;
 var key=wa[wa.length-1].wk;if(st.adaptDismissed===key)return null;
 if(g==='lose'&&ch>-0.1)return {d:-150,txt:t('adaptLose'),key:key};
 if(g==='gain'&&ch<0.05)return {d:150,txt:t('adaptGain'),key:key};return null;}
function bests(){var b={};st.history.forEach(function(hh){(hh.detail||[]).forEach(function(s){var c=b[s.exId];if(!c||s.kg>c.kg||(s.kg===c.kg&&s.reps>c.reps))b[s.exId]={kg:s.kg,reps:s.reps,date:hh.date};});});
 return Object.keys(b).map(function(k){return {exId:k,kg:b[k].kg,reps:b[k].reps,date:b[k].date};}).sort(function(x,y){return y.kg-x.kg;}).slice(0,5);}

  (paid()?weightChart():'<div class="row small muted lock"><span>'+ic('lockic',18)+'</span>'+t('chartLocked')+'</div>')+

 var wz=st.waists[st.waists.length-1],wz0=st.waists[0];

 h+='<div class="grid2"><div class="tile"><span class="small muted">'+t('waist')+'</span><span class="big num">'+(wz?fmt(wz.cm,1):'–')+' <span class="small muted" style="font-weight:600">'+t('cm')+'</span></span>'+(wz&&wz0&&wz!==wz0?'<span class="small accent num" style="font-weight:600">'+(wz.cm-wz0.cm>0?'+':'')+fmt(wz.cm-wz0.cm,1)+' '+t('cm')+'</span>':'')+'<div class="row" style="margin-top:6px"><label class="vh" for="waistIn">'+t('waist')+'</label><input id="waistIn" class="input num" inputmode="decimal" placeholder="'+t('cm')+'" style="height:40px;min-width:0"><button class="btn sm" style="min-height:40px;padding:0 12px" data-act="logWaist" aria-label="'+t('logWaist')+'">'+ic('plus',16,2.4)+'</button></div></div>'+
  '<div class="tile"><span class="small muted">'+t('sessions30')+'</span><span class="big num">'+n30+'</span></div></div>';
 var bs=bests();

 if(o.step===4&&!d.plan)d.plan=d.level==='advanced'?'split':d.level==='intermediate'?'ppl':'fb';
 if(o.step===5||(o.edit&&o.step===4)){var prof={name:String(d.name).trim(),sex:d.sex,age:+d.age,height:+d.height,weight:+d.weight,activity:+d.activity,goal:+d.age<18?'maintain':d.goal,level:d.level};
  var goalChanged=st.profile&&st.profile.goal!==prof.goal;st.profile=prof;if(goalChanged)st.kcalAdjust=0;if(prof.age<18)st.tier='free';
  if(st.planId!==d.plan){st.planId=d.plan;st.nextIndex=0;}
  if(!st.weights.some(function(w){return w.date===dkey();}))st.weights.push({date:dkey(),kg:prof.weight});
  ui.onb=null;ui.route='today';save();return;}
 o.step++;}
document.addEventListener('input',function(ev){var e=ev.target,k=e.getAttribute('data-in');if(!k)return;
 if(k==='onb'){ui.onb.d[e.getAttribute('data-k')]=e.value;return;}
 if(k==='cardio'&&st.active){st.active.cardioMin=e.value;save();return;}
 if((k==='kg'||k==='reps')&&st.active){var it=st.active.items[st.active.exIdx],i=+e.getAttribute('data-i');it.log[i][k]=e.value.replace(',','.');save();return;}
 if(k==='foodQ'){ui.foodQ=e.value;var l=document.getElementById('fList');if(l)l.innerHTML=foodListHtml(e.value.toLowerCase());return;}
 if(k==='foodG'){ui.foodG=e.value;var f=findFood(ui.foodSel),p=document.getElementById('fPrev');if(f&&p)p.innerHTML=foodPrev(f,(parseFloat(e.value)||0)/100);return;}});

/* ---------- Ticker ---------- */
setInterval(function(){var a=st.active;if(!a)return;
 document.querySelectorAll('[data-tick="elapsed"]').forEach(function(e){e.textContent=dur(Date.now()-a.startedAt);});
 if(a.restEnd){var left=a.restEnd-Date.now();document.querySelectorAll('[data-tick="rest"]').forEach(function(e){e.textContent=dur(Math.max(0,left));});
  if(left<=0){a.restEnd=null;ui.restDone=true;save();beep();cueNextSet();var ae=document.activeElement;if(!(ae&&ae.tagName==='INPUT')){syncInputs();render();}}}},500);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&st.active)wake();});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(st.theme==='auto')render();});}catch(e){}
if(st.active&&!(st.active.items&&st.active.items[0]&&st.active.items[0].reps))st.active=null;
if(st.active)ui.route='workout';
render();
})();
</script>
